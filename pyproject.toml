[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-agent"
version = "0.1.0"
description = "Agente analítico de solo lectura para BigQuery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.18,<4",
    "google-cloud-storage>=2.16,<4",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1,<2",
    "rich>=13,<15",
    "sqlglot>=25,<30",
]

[project.optional-dependencies]
teams-worker = [
    "google-cloud-pubsub>=2.25,<3",
]
teams-gateway = [
    "fastapi>=0.115,<1",
    "google-auth>=2.29,<3",
    "google-cloud-firestore>=2.19,<3",
    "google-cloud-pubsub>=2.25,<3",
    "microsoft-teams-apps>=2.1,<3",
    "microsoft-teams-cards>=2.1,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
analytics-agent = "analytics_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analytics_agent = ["data/*.json", "prompts/*.txt"]

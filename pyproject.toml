[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-agent"
version = "0.1.0"
description = "Agente analítico de solo lectura para BigQuery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.18,<4",
    "google-cloud-storage>=2.16,<4",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1,<2",
    "rich>=13,<15",
    "sqlglot>=25,<30",
]

[project.scripts]
analytics-agent = "analytics_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analytics_agent = ["data/*.json", "prompts/*.txt"]
